<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="theme-color" content="#122645" />
    <title>INMUNO · Defensores del cuerpo</title>
    <link rel="stylesheet" href="action.css" />
  </head>
  <body data-mode="action">
    <div id="action-world"></div>
    <div class="vignette"></div>
    <header class="game-top">
      <a href="#" id="brand" aria-label="Pausar INMUNO"
        ><b>✚ INMUNO</b><span>DEFENSORES DEL CUERPO</span></a
      >
      <div class="compass">
        <span>NO</span><span id="heading">N · 0°</span><span>NE</span>
      </div>
      <div class="top-actions">
        <button id="sound-button" aria-label="Sonido">♫</button
        ><button id="pause-button" aria-label="Pausa y opciones">Ⅱ</button
        ><button id="fullscreen" aria-label="Pantalla completa">⛶</button>
      </div>
    </header>
    <section id="quest" class="quest"></section>
    <aside class="radar-panel">
      <div class="radar" id="radar"></div>
      <div class="radar-caption">
        <span id="location">ZONA CENTRAL</span><b id="restored-count">0 / 4</b>
      </div>
    </aside>
    <div id="boss-bar" class="boss-bar" hidden></div>
    <div id="reticle" class="reticle"><i></i><i></i><i></i><i></i></div>
    <div id="waypoint" class="waypoint" hidden></div>
    <div id="interaction" class="interaction" hidden>
      <button id="interact-button"></button>
    </div>
    <div
      id="notification"
      class="notification"
      role="status"
      aria-live="polite"
    ></div>
    <div class="game-bottom">
      <div class="vitals">
        <div class="player-tag">
          <span class="avatar-icon">✚</span>
          <div>
            <b>AGENTE INMUNO</b><small id="level-tag">EXPLORADOR</small>
          </div>
        </div>
        <div class="meter">
          <span>✚</span>
          <div><i id="health-fill"></i></div>
          <b id="health-number">100</b>
        </div>
        <div class="shield-status" id="shield-status">Q · Escudo listo</div>
      </div>
      <div class="loadout" id="loadout"></div>
      <div class="score-box">
        <span>ENERGÍA RECUPERADA</span><b id="score">0</b
        ><small id="kills">0 microbios neutralizados</small>
      </div>
    </div>
    <div class="controls-hint" id="controls-hint">
      WASD · Mover &nbsp; ESPACIO · Saltar &nbsp; MAYÚS · Correr &nbsp; CLIC ·
      Lanzar &nbsp; Q · Escudo &nbsp; F · Construir &nbsp; E · Activar
    </div>
    <div class="simple-controls">
      <div id="guide-caption">Lumi te acompaña.</div>
      <button class="primary" id="guide-toggle">✦ Guíame</button
      ><button class="primary" id="protect-button" hidden>
        ◈ Mantén PROTEGER
      </button>
    </div>
    <div id="touch-controls">
      <div class="joystick" id="joystick"><div id="stick"></div></div>
      <div
        class="touch-look"
        id="touch-look"
        aria-label="Arrastra para girar la cámara"
      ></div>
      <div class="touch-buttons">
        <button id="touch-shield" aria-label="Escudo">◈</button
        ><button id="touch-build" aria-label="Construir barrera">▥</button
        ><button id="touch-jump" aria-label="Saltar">↟</button
        ><button id="touch-fire" aria-label="Lanzar defensa">◎</button>
      </div>
    </div>
    <dialog id="action-dialog" aria-labelledby="dialog-title">
      <div id="modal-content"></div>
    </dialog>
    <input
      type="file"
      id="action-import"
      accept="application/json,.json"
      hidden
    />
    <script src="build/game.js" defer></script>
  </body>
</html>
