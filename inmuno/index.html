<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eff5ee"><title>INMUNO · Un mundo dentro de ti</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="#" aria-label="INMUNO, inicio"><span class="brand-icon">✚</span>inmuno<span class="brand-dot">.</span></a><div class="header-caption">UN MUNDO DENTRO DE TI</div><nav><button id="sound">♫ <span>Sonido</span></button><button id="help">? <span>Cómo jugar</span></button><button id="session">☰ <span>Sesión</span></button></nav></header>

<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog><input id="import-file" type="file" accept="application/json,.json" hidden>
